<div class="caller-post"><h2>Caisse / Caller Post</h2><div *ngIf="!logged" class="login-box"><label>Identifiant <input [(ngModel)]="username"/></label><label>Mot de passe <input type="password" [(ngModel)]="password"/></label><button (click)="login()">Se connecter</button><p *ngIf="error" style="color:red">{{error}}</p></div><div *ngIf="logged"><h3>Numéro courant : <strong>{{current?.displayNumber||'-'}}</strong></h3><button (click)="next()">Suivant / Next</button><button (click)="recall()">Rappel / Recall</button><button (click)="pause()">Pause / Résumé</button><button (click)="logout()">Déconnexion</button></div></div>
