<div class="heading"><div><small>GESTION</small><h1>{{title}}</h1><p>Configuration et suivi des éléments de l'établissement.</p></div><button (click)="load()">Actualiser</button></div><section class="panel" *ngIf="entity==='tickets'"><h2>Opérations de caisse</h2><div class="inline"><select [(ngModel)]="queueId"><option value="">Sélectionner une file</option><option *ngFor="let q of queues" [value]="q._id">{{q.name}}</option></select><select [(ngModel)]="counterId"><option value="">Sélectionner une caisse</option><option *ngFor="let c of counters" [value]="c._id">{{c.name}}</option></select><button (click)="createTicket()">Créer ticket</button><button (click)="callNext()">Appeler suivant</button></div></section><section class="panel"><div class="inline"><h2>{{rows.length}} enregistrements</h2><span class="muted">Données du serveur local</span></div><div class="formrow" *ngIf="['queues','counters','users','displays','announcements'].includes(entity)"><input [(ngModel)]="name" placeholder="Nom / libellé"><input [(ngModel)]="code" placeholder="Code (si applicable)"><button (click)="create()">Ajouter</button></div><table><thead><tr><th *ngFor="let k of columns">{{k}}</th></tr></thead><tbody><tr *ngFor="let r of rows"><td *ngFor="let k of columns">{{r[k]||'—'}}</td></tr></tbody></table></section>
